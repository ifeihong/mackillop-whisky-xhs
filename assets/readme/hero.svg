    <!-- v5.0 version badge (top-left, above TRAVERSE SKILL) -->
    <rect x="20" y="0" width="68" height="36" rx="18" fill="#000"/>
    <text x="54" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" font-weight="900" fill="#FFD700" text-anchor="middle">v5.0</text>

    <!-- TRAVERSE SKILL badge -->
    <rect x="100" y="0" width="200" height="36" rx="18" fill="#FF0000"/>
    <text x="200" y="24" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="2">TRAVERSE SKILL</text>

    <!-- BORED WHISKY title -->
    <g filter="url(#comic-shadow)">
      <text x="20" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" font-weight="900" fill="#FFD700" stroke="#000" stroke-width="3" paint-order="stroke" letter-spacing="2">BORED</text>
      <text x="20" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" font-weight="900" fill="#FFD700" stroke="#000" stroke-width="3" paint-order="stroke" letter-spacing="2">WHISKY</text>
    </g>

    <!-- Chinese subtitle inverted bar -->
    <rect x="20" y="215" width="370" height="46" rx="4" fill="#000"/>
    <text x="205" y="245" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="26" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="3">小红书图文助手</text>

    <!-- Description -->
    <text x="20" y="300" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="17" fill="#333" font-weight="700">6大模板 × 8种视觉风格 × 8种配色 · 数据驱动设计感融合</text>
    <text x="20" y="326" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="14" fill="#666">基于88篇真实笔记数据分析 · 适配 GPT Image2 / Seedream5.0 / Nano Banana Pro</text>

