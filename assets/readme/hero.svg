      <text x="22" y="73" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="14" fill="#333" font-weight="600">6 种情绪 · 8 种标题公式 · 6 种文案结构 · 6 种CTA</text>
