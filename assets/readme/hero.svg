  <!-- ============ RIGHT SIDE ============ -->

  <!-- Output labels -->
  <g transform="translate(680, 48)">
    <rect x="0" y="0" width="155" height="34" rx="17" fill="#FF0000" stroke="#000" stroke-width="1.5" transform="rotate(-3)"/>
    <text x="77" y="23" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" transform="rotate(-3)">封面图提示词</text>

