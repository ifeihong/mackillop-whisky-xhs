<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">BORED WHISKY Xiaohongshu Content Generator v5.0</title>
  <desc id="desc">v5.0 — 6 content templates × 8 visual styles × 8 color schemes × 8 info layouts, data-driven design fusion for BORED WHISKY Xiaohongshu</desc>

  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3.5" fill="#000" opacity="0.1"/>
    </pattern>
    <filter id="comic-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <path id="star-s" d="M0,-14 L2.5,-4.5 L12,-4.5 L4.5,1.5 L7,11 L0,5.5 L-7,11 L-4.5,1.5 L-12,-4.5 L-2.5,-4.5 Z" fill="#FF0000"/>
    <path id="star-l" d="M0,-20 L3.5,-6.5 L17,-6.5 L6.5,2.5 L10,15 L0,8 L-10,15 L-6.5,2.5 L-17,-6.5 L-3.5,-6.5 Z" fill="#FF0000"/>
  </defs>

  <!-- Outer background -->
  <rect width="1200" height="860" fill="#87CEEB"/>
  <rect width="1200" height="860" fill="url(#dots)"/>

  <!-- Comic panel frames -->
  <rect x="10" y="10" width="1180" height="840" rx="0" fill="none" stroke="#000" stroke-width="10"/>
  <rect x="15" y="15" width="1170" height="830" rx="0" fill="none" stroke="#fff" stroke-width="5"/>
  <rect x="20" y="20" width="1160" height="820" rx="0" fill="#fff"/>

  <!-- ============ LEFT CONTENT ============ -->
  <g transform="translate(60, 46)">

