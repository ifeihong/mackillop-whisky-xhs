      <text x="40"  y="22" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="13" fill="#000" text-anchor="middle" font-weight="700">T1 大字</text>
      <rect x="88"  y="0" width="80" height="32" rx="16" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
      <text x="128" y="22" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="13" fill="#000" text-anchor="middle" font-weight="700">T2 氛围</text>
      <rect x="176" y="0" width="88" height="32" rx="16" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
      <text x="220" y="22" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="13" fill="#000" text-anchor="middle" font-weight="700">T3 信息卡</text>
      <rect x="272" y="0" width="88" height="32" rx="16" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
      <text x="316" y="22" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="13" fill="#000" text-anchor="middle" font-weight="700">T4 桌面</text>
      <rect x="368" y="0" width="80" height="32" rx="16" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
      <text x="408" y="22" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="13" fill="#000" text-anchor="middle" font-weight="700">T5 人物</text>
      <rect x="456" y="0" width="80" height="32" rx="16" fill="#FFD700" stroke="#000" stroke-width="1.5"/>
      <text x="496" y="22" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="13" fill="#000" text-anchor="middle" font-weight="700">T6 拼贴</text>
