    <path d="M80 82 Q145 130 225 100" stroke="#000" stroke-width="2" fill="none" stroke-dasharray="6 3"/>
    <circle cx="225" cy="100" r="5" fill="#FF0000" stroke="#000" stroke-width="1.5"/>
  </g>

