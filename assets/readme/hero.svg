    <line x1="20" y1="358" x2="560" y2="358" stroke="#000" stroke-width="2" stroke-dasharray="8 4"/>
    <rect x="20" y="348" width="130" height="22" fill="#FF0000"/>
    <text x="85" y="364" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="1">6 大模板</text>

