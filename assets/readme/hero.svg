      <text x="79" y="92" font-family="-apple-system, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">口袋装 · 一个人的微醺刚刚好</text>
      <rect x="12" y="104" width="134" height="20" rx="4" fill="#FFD700" fill-opacity="0.15" stroke="#FFD700" stroke-width="0.8"/>
      <text x="79" y="118" font-family="-apple-system, sans-serif" font-size="10" fill="#FFD700" text-anchor="middle" font-weight="600">40度 · 琥珀色酒液 · 手掌大小</text>
      <!-- Bottle silhouette -->
      <path d="M62 155 L62 138 Q62 132 68 132 L90 132 Q96 132 96 138 L96 155 Q110 162 110 178 L110 200 Q110 204 106 204 L52 204 Q48 204 48 200 L48 178 Q48 162 62 155 Z" fill="#1a1a1a" stroke="#FFD700" stroke-width="1.2"/>
      <rect x="66" y="162" width="26" height="30" rx="2" fill="#0c0c0a" stroke="#FFD700" stroke-width="0.6"/>
      <text x="79" y="176" font-family="Georgia, serif" font-size="8" font-style="italic" font-weight="900" fill="#FFD700" text-anchor="middle">BORED</text>
      <text x="79" y="186" font-family="-apple-system, sans-serif" font-size="7" fill="#fff" text-anchor="middle">WHISKY</text>
    </g>
    <rect x="70" y="250" width="50" height="3" rx="1.5" fill="#333"/>
  </g>

  <!-- Bottle silhouette -->
  <g transform="translate(980, 60)" opacity="0.85">
    <circle cx="90" cy="240" r="180" fill="#FFD700" fill-opacity="0.06"/>
    <path d="M55 60 L55 20 Q55 5 70 5 L110 5 Q125 5 125 20 L125 60 Q165 85 165 170 L165 420 Q165 435 150 435 L30 435 Q15 435 15 420 L15 170 Q15 85 55 60 Z" fill="#1a1a1a" stroke="#FFD700" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M22 220 Q22 200 34 200 L146 200 Q158 200 158 220 L158 420 Q158 430 146 430 L34 430 Q22 430 22 420 Z" fill="#FFD700" fill-opacity="0.15" stroke="#FFD700" stroke-width="0.8" stroke-opacity="0.3"/>
    <rect x="58" y="245" width="64" height="70" rx="4" fill="#0c0c0a" stroke="#FFD700" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="90" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="900" fill="#FFD700" text-anchor="middle" letter-spacing="1.5">BORED</text>
    <text x="90" y="302" font-family="-apple-system, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="500" letter-spacing="1">WHISKY</text>
    <rect x="75" y="228" width="30" height="10" rx="3" fill="#FF0000" fill-opacity="0.3" stroke="#FFD700" stroke-width="0.8" stroke-opacity="0.4"/>
    <ellipse cx="50" cy="120" rx="5" ry="18" fill="#FFD700" fill-opacity="0.15"/>
    <ellipse cx="130" cy="220" rx="3" ry="12" fill="#FFD700" fill-opacity="0.12"/>
  </g>

  <!-- Starburst decorations -->
  <g transform="translate(580, 55)"><use href="#star-s" x="0" y="0" transform="rotate(15)"/></g>
  <g transform="translate(720, 330)"><use href="#star-l" x="0" y="0" transform="rotate(-20)"/></g>
  <g transform="translate(1080, 420)"><use href="#star-s" x="0" y="0" transform="rotate(45)"/></g>
  <g transform="translate(620, 520)"><use href="#star-s" x="0" y="0" transform="rotate(-10)"/></g>

  <!-- ============ BOTTOM BANNER ============ -->
  <g transform="translate(20, 750)">
    <rect x="0" y="0" width="1160" height="60" fill="#FFD700" stroke="#000" stroke-width="3"/>
    <rect x="5" y="5" width="1150" height="50" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
    <use href="#star-s" x="50" y="30" transform="rotate(-10 50 30)"/>
    <use href="#star-s" x="1110" y="30" transform="rotate(10 1110 30)"/>
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="13" fill="#000" font-weight="700" letter-spacing="1">品牌 DNA</text>
    <text x="80" y="48" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="17" fill="#000" font-weight="900">BAYC #480 · 数字雅痞 · 社交货币 · 手掌大小 · 口袋装</text>
    <circle cx="68" cy="36" r="4" fill="#FF0000"/>
