    </g>
    <!-- Last text absolute y = 46 + 475 + 133 = 654. Banner at 750. Gap = 96px -->

    <!-- Combination count -->
    <g transform="translate(20, 638)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="14" fill="#666" font-weight="500">理论组合数</text>
      <text x="88" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" font-weight="900" fill="#FF0000">7,077,888</text>
      <text x="200" y="0" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="14" fill="#666" font-weight="500">种</text>
    </g>
